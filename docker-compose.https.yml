# HTTPS override: nginx terminates TLS on ports 443/80; the backend and UI are no longer published on the host.
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#   (add -f docker-compose.gpu.yml for GPU)
# Requires deploy/certs/fullchain.pem and deploy/certs/privkey.pem, see docs/docker_deployment.md.
services:
  backend:
    # Reachable only through the proxy and the UI container
    ports: !reset []
    environment:
      # Trust X-Forwarded-For from the proxy, so audit logs and rate limits see the real client IP.
      # Safe only because the backend port is not published.
      - FORWARDED_ALLOW_IPS=*
      # The web UI's refresh token cookie is only sent over HTTPS
      - REFRESH_COOKIE_SECURE=true

  frontend:
    ports: !reset []

  web:
    ports: !reset []

  proxy:
    image: nginx:1.27-alpine
    container_name: rag_agents_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - web
    networks:
      - rag_network
