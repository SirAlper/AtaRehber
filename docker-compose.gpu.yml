# NVIDIA GPU override: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# The GPU goes to Ollama, which runs the LLM. The embedding and reranker models stay on CPU
# (RAG_DEVICE=cpu) so the whole GPU memory is available to the LLM.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
