services:
  # ───────────────────────────────────────────────────────────────────────────
  # Backend: FastAPI REST API + LangGraph agents + ChromaDB + embedding/reranker models
  # The LLM runs in the ollama service below.
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    container_name: rag_agents_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Every setting from .env (next to this file) is passed to the container.
    # The defaults below apply only when .env does not define the variable.
    env_file:
      - path: .env
        required: false
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501,http://frontend:8501}
      - RAG_DEVICE=${RAG_DEVICE:-cpu}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-50}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOW_ONLINE_HF=${ALLOW_ONLINE_HF:-0}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - ./backups:/app/backups
    depends_on:
      # Started, not "healthy": the API also works without the LLM (documents, users, audit)
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - rag_network

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend: Streamlit Web UI Management Dashboard & Assistant Chat
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag_agents_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag_network

  # ───────────────────────────────────────────────────────────────────────────
  # Ollama: serves the LLM. GPU acceleration: add -f docker-compose.gpu.yml
  # No host port is published (the backend uses the internal network), so this does not
  # clash with an Ollama already running on the host. Use: docker compose exec ollama ollama list
  # ───────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag_agents_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - rag_network

  # One-shot job: pulls OLLAMA_MODEL on first start (a no-op once the model is present).
  # Queries fail with an "ollama pull" hint in the logs until it finishes.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: rag_agents_ollama_pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:7b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  ollama_data:
