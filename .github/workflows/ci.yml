name: CI Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install "ruff>=0.5.0,<0.6"

      - name: Run Ruff linter
        run: ruff check src/ tests/ evals/ ui/ --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/ evals/ ui/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      # Run every version to completion so a failure shows whether it is version-specific
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
        env:
          ALLOW_ONLINE_HF: "0"
          # Never download multi-GB model weights in CI; model-dependent tests skip or stub instead
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  db-integration:
    name: Database Integration (PostgreSQL & MySQL)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: olra_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: pip install -r requirements-dev.txt

      - name: Run read-only enforcement tests against real databases
        # -rs lists skipped tests, so a missing server shows up in the log instead of passing silently
        run: pytest tests/data/test_db_integration.py -v -rs
        env:
          TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/olra_test
          TEST_MYSQL_URL: mysql+pymysql://root:root@127.0.0.1:3306/olra_test
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: openlocalragagents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: openlocalragagents-ui:ci

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.https.yml config --quiet
          # In HTTPS mode only the proxy may be published on the host
          https_config=$(docker compose -f docker-compose.yml -f docker-compose.https.yml config --format json)
          test "$(echo "$https_config" | jq '[.services.backend.ports, .services.frontend.ports] | map(. // [] | length) | add')" = "0"

      - name: Validate nginx configuration
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" \
            -keyout /tmp/certs/privkey.pem -out /tmp/certs/fullchain.pem
          docker run --rm --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v /tmp/certs:/etc/nginx/certs:ro \
            nginx:1.27-alpine nginx -t
