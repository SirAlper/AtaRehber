# Serves the built web UI and forwards the API to the backend container.

# File names under /assets carry a content hash, so they can be cached for good; index.html never is.
# (One map instead of add_header per location: a location's add_header would drop the server-level headers.)
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Matches the default MAX_UPLOAD_SIZE_MB (50); raise both together
    client_max_body_size 50m;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Deliver /api/v1/query-stream events as they are produced
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routes (/requests, /admin/...) all load index.html
    location / {
        try_files $uri /index.html;
    }
}
