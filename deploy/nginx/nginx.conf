# HTTPS reverse proxy for OpenLocalRagAgents (used by docker-compose.https.yml).
# Certificates: deploy/certs/fullchain.pem and deploy/certs/privkey.pem (see docs/docker_deployment.md).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Matches the default MAX_UPLOAD_SIZE_MB (50); raise both together
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend {
        server frontend:8501;
    }

    # React web UI (the web service). To serve it instead of Streamlit, point "location /" below at
    # http://web and drop its WebSocket lines; /api keeps going straight to the backend.
    upstream web {
        server web:80;
    }

    upstream backend {
        server backend:8000;
    }

    # Plain HTTP only redirects to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # REST API for API clients and portal integrations (every endpoint except /health needs a JWT).
        # Remove this block to serve only the web UI.
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            # Deliver /api/v1/query-stream events as they are produced
            proxy_buffering off;
        }

        location = /health {
            proxy_pass http://backend;
        }

        # Streamlit web UI (uses a WebSocket)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }
    }
}
